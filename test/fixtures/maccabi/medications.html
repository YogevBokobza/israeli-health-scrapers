<!--
  Representative shape of Maccabi's ValidPrescriptions page.

  Structurally captured from a real logged-in session (not the actual medical data —
  every drug name, doctor, and date below is invented). Each prescription is a card in
  a `[data-testid="prescription-row"]` list, not a <table>. A "תרופה קבועה" (standing
  medication) badge distinguishes a standing prescription from a one-off; only the
  former is a `Medication` we surface.

  It deliberately includes: a standing row, a one-off row with no badge (must be
  filtered out), a two-digit year, and a row missing its name (a layout artifact that
  must not survive parsing).
-->
<div role="list" data-hook="LazyLoading">
  <div role="listitem" data-testid="prescription-row">
    <div data-hook="Badge">תרופה קבועה</div>
    <div data-hook="TimeLineDate">09/08/26</div>
    <div class="TimeLineItem-module__header___gW2KR">FICTAMOL 500MG TAB (20)</div>
    <div class="MedicationsTimelineRow__specializationRow___WuCpD">
      <p class="m-0">דר ישראלי דנה, רפואת משפחה</p>
    </div>
  </div>

  <div role="listitem" data-testid="prescription-row">
    <div data-hook="Badge">תרופה קבועה</div>
    <div data-hook="TimeLineDate">03/01/27</div>
    <div class="TimeLineItem-module__header___gW2KR">SAMPLEXIN 250MG CAP</div>
    <div class="MedicationsTimelineRow__specializationRow___WuCpD">
      <p class="m-0">דר מזרחי אלון, קרדיולוגיה</p>
    </div>
  </div>

  <div role="listitem" data-testid="prescription-row">
    <!-- No Badge: a one-off prescription, not a standing one. Must be dropped. -->
    <div data-hook="TimeLineDate">20/01/26</div>
    <div class="TimeLineItem-module__header___gW2KR">TESTOPRIL 100MG TAB 30</div>
    <div class="MedicationsTimelineRow__specializationRow___WuCpD">
      <p class="m-0">דר בר-און מיכל, רפואת משפחה</p>
    </div>
  </div>

  <div role="listitem" data-testid="prescription-row">
    <div data-hook="Badge">תרופה קבועה</div>
    <div data-hook="TimeLineDate">01/06/26</div>
    <!-- No header element: a layout artifact with no drug name. Must be dropped. -->
    <div class="MedicationsTimelineRow__specializationRow___WuCpD">
      <p class="m-0">דר גולן עידו</p>
    </div>
  </div>
</div>
