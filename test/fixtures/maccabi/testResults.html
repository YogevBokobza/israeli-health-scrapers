<!--
  Sanitized shape of Maccabi's test-results timeline. The selectors and nesting mirror
  a live page, but every person, date, category subtype, and medical detail is invented.

  The fixture covers a laboratory result whose timeline and execution dates differ, a
  cardiology result with a subtype, and an imaging result without TestExecuteDate.
-->
<div role="list" data-hook="LazyLoading">
  <div role="listitem" data-hook="TimeLineItem">
    <div data-hook="TimeLineDate">21/12/24</div>
    <div data-hook="HeaderTimeLineItem">מעבדה</div>
    <ul role="presentation">
      <li data-hook="TestExecuteDate"><span>תאריך הבדיקה: 20/12/24</span></li>
      <li><span>‏רופא מפנה: דר דוגמה רונית</span></li>
    </ul>
  </div>

  <div role="listitem" data-hook="TimeLineItem">
    <div data-hook="TimeLineDate">17/10/24</div>
    <div data-hook="HeaderTimeLineItem">קרדיולוגיה</div>
    <ul data-hook="CategoryList">
      <li><span data-hook="CategoryList_item">תוצאת בדיקה לדוגמה</span></li>
    </ul>
    <ul role="presentation">
      <li data-hook="TestExecuteDate"><span>תאריך הבדיקה: 16/10/24</span></li>
      <li><span>רופא מפנה: דר בדוי אורי</span></li>
    </ul>
  </div>

  <div role="listitem" data-hook="TimeLineItem">
    <div data-hook="TimeLineDate">08/06/24</div>

      <li><span data-hook="CategoryList_item">צילום אזור לדוגמה</span></li>
    </ul>
    <ul role="presentation">
      <li><span>רופא מפנה: דר משל תמר</span></li>
    </ul>
  </div>
</div>
